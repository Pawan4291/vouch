[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"

[rpc_endpoints]
amoy = "https://polygon-amoy.drpc.org"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api", chain = 80002 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
